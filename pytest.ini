[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests for individual functions and classes
    integration: Integration tests for multi-component workflows
    contract: Contract tests validating API specifications
    accessibility: Accessibility tests using Playwright and axe-core
    slow: Tests that take longer than 1 second to run

# Console output configuration
console_output_style = progress
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=scripts
    --cov-report=term-missing:skip-covered
    --cov-report=html:reports/coverage
    --cov-report=json:reports/coverage/coverage.json
    --junit-xml=reports/tests/pytest-junit.xml

# Coverage configuration
[coverage:run]
branch = True
source = scripts
omit = 
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Minimum coverage threshold (85%)
fail_under = 85

exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if TYPE_CHECKING:
    @abstractmethod
