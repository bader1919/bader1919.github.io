<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bader Abdulrahim | Portfolio{% endblock %}</title>
  
  <!-- Meta tags for better SEO -->
  <meta name="description" content="{% block description %}Professional portfolio of Bader Abdulrahim, specializing in smart home automation, data analytics, and custom tech solutions.{% endblock %}">
  <meta name="keywords" content="{% block keywords %}smart home, automation, data analytics, Power BI, SQL, Home Assistant{% endblock %}">
  
  {% block og_tags %}
  <!-- Open Graph meta tags -->
  <meta property="og:title" content="{% block og_title %}Bader Abdulrahim | Portfolio{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Professional portfolio showcasing data analytics and smart home automation projects{% endblock %}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:url" content="{% block og_url %}https://bader1919.github.io/{% endblock %}">
  <meta property="og:image" content="{% block og_image %}/assets/img/social-share.jpg{% endblock %}">
  {% endblock %}
  
  <!-- Favicon -->
  <link rel="icon" href="/assets/img/favicon.ico" type="image/x-icon">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  
  {% block extra_css %}{% endblock %}
</head>

<body>
  {% include 'partials/header.html' %}
  
  <!-- Skip to main content link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  
  {% include 'partials/footer.html' %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom JS -->
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/components.js"></script>
  
  {% block extra_js %}{% endblock %}
</body>
</html>
